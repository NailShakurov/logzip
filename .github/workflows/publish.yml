name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python3.11
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux
          path: dist/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --target universal2-apple-darwin --features pyo3/abi3-py39
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # idempotent re-runs: don't fail on wheels already uploaded
          skip-existing: true

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish logzip-core
        run: |
          # `|| STATUS=$?` keeps bash -e from killing the step before the guard runs
          STATUS=0
          OUT=$(cargo publish -p logzip-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }} 2>&1) || STATUS=$?
          echo "$OUT"
          [ $STATUS -eq 0 ] || echo "$OUT" | grep -qE "already (exists|uploaded)" || exit $STATUS
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish logzip
        run: |
          STATUS=0
          OUT=$(cargo publish -p logzip --token ${{ secrets.CARGO_REGISTRY_TOKEN }} 2>&1) || STATUS=$?
          echo "$OUT"
          [ $STATUS -eq 0 ] || echo "$OUT" | grep -qE "already (exists|uploaded)" || exit $STATUS
